name: 纠错
description: 报告文档中的数据错误、表述问题或失效链接
title: "[fix] "
labels: ["correction"]
body:
  - type: input
    id: location
    attributes:
      label: 出错位置
      description: 文件名 + 章节 / 行号
      placeholder: "例：kimi-k3-tech-blog.md 第 6.1 节 Terminal-Bench 行"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前内容
      description: 文档中现有的（错误的）表述
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 正确内容
      description: 应该改成什么
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 一手来源
      description: 官方模型卡 / 官方博客 / 论文 / 源码的链接 + 原文摘录（第三方二手来源不足以推翻官方口径）
    validations:
      required: true
